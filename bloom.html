<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B3FA6">
<meta name="description" content="Ciclo Sync · Bloom — creative practice, connection, and stillness, synced to your cycle.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bloom">
<link rel="manifest" href="bloom.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ciclo Sync · Bloom</title>
<style>
  html,body{margin:0;padding:0;background:#EEECEA;-webkit-text-size-adjust:100%}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  *{box-sizing:border-box}
  button,input,textarea,a{font-family:inherit}
  /* back to the five-circle hub — small enough not to crowd the centred header */
  #hub{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:80;
       width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
       background:rgba(246,244,241,0.86);border:1px solid #D0CCC7;
       text-decoration:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(6px);
       transition:transform .12s ease}
  #hub img{width:26px;height:26px;object-fit:contain;display:block}
  #hub:active{transform:scale(0.94)}
  #boot{padding:80px 24px;text-align:center;color:#9E9A96;
        font-family:'Avenir Next','Segoe UI',system-ui,sans-serif;font-size:13px;font-style:italic}
</style>
</head>
<body>
<a id="hub" href="index.html" aria-label="Back to Ciclo Sync"><img src="logo.png" alt=""></a>
<div id="root"><div id="boot">Bloom is opening&#8230;</div></div>
