<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5B3FA6">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ciclo Sync</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#EEECEA;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,'Palatino Linotype',serif;padding:24px}
  .stage{position:relative;width:min(82vw,440px);aspect-ratio:1/1}
  .stage img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
  .zone{position:absolute;border-radius:50%;display:block;-webkit-tap-highlight-color:transparent;outline:none;transition:transform .12s ease, background .12s ease}
  .zone:active{transform:scale(0.96);background:rgba(255,255,255,0.18)}
  .zone:focus-visible{box-shadow:0 0 0 3px #5B3FA6}
  /* generous overlapping hit-regions matching each petal's position */
  .z-eat   { top:1%;  left:27%; width:46%; height:42%; }
  .z-move  { top:15%; left:1%;  width:46%; height:42%; }
  .z-bloom { top:15%; left:53%; width:46%; height:42%; }
  .z-rest  { top:40%; left:8%;  width:46%; height:42%; }
  .z-work  { top:40%; left:46%; width:46%; height:42%; }
  p.tag{color:#6B6460;font-size:13px;margin-top:22px;text-align:center;font-style:italic}
  #toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,12px);background:#2A2420;color:#F6F4F1;padding:10px 18px;border-radius:999px;font-family:'Palatino Linotype',serif;font-size:13px;opacity:0;transition:all .25s ease;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
  <div class="stage">
    <img src="logo.png" alt="Ciclo Sync — Eat, Move, Rest, Work, Bloom">
    <a class="zone z-eat"   href="eat.html"  aria-label="Enter Eat"></a>
    <a class="zone z-move"  href="move.html" aria-label="Enter Move"></a>
    <a class="zone z-bloom" href="#" data-soon="🌸 Bloom is being built — soon" aria-label="Bloom, coming soon"></a>
    <a class="zone z-rest"  href="#" data-soon="🌙 Rest is being built — soon" aria-label="Rest, coming soon"></a>
    <a class="zone z-work"  href="#" data-soon="💼 Work is being built — soon" aria-label="Work, coming soon"></a>
  </div>
  <p class="tag">Live with your cycle. Your data never leaves your pocket.</p>
  <div id="toast"></div>
  <script>
    var toast = document.getElementById('toast'), t;
    document.querySelectorAll('[data-soon]').forEach(function(el){
      el.addEventListener('click', function(ev){
        ev.preventDefault();
        toast.textContent = el.getAttribute('data-soon');
        toast.classList.add('show');
        clearTimeout(t); t = setTimeout(function(){ toast.classList.remove('show'); }, 1800);
      });
    });
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    }
  </script>
</body>
</html>
